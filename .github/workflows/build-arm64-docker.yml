name: Build FanchmWrt arm64 rootfs and Docker image

on:
  workflow_dispatch:
  push:
    branches: [ fanchmwrt-25.12.6 ]
    paths:
      - '.github/workflows/build-arm64-docker.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: arm64-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: fanchmwrt-arm64

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-armsr-armv8-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-armsr-armv8-

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-armsr-armv8-${{ hashFiles('feeds.conf.default') }}
          restore-keys: dl-armsr-armv8-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_armsr_armv8_device_generic=y
          CONFIG_TARGET_ROOTFS_TARGZ=y
          CONFIG_TARGET_IMAGES_GZIP=y
          EOF
          make defconfig
          echo "--- selected target ---"
          grep -E '^CONFIG_TARGET_(armsr|ROOTFS_TARGZ)' .config
          grep -q '^CONFIG_TARGET_ROOTFS_TARGZ=y' .config || { echo "ERROR: TARGET_ROOTFS_TARGZ not enabled"; grep TARGET_ROOTFS_TARGZ .config || true; exit 1; }

      - name: Build rootfs
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          make -j$(nproc)

      - name: Prepare docker context
        id: rootfs
        run: |
          echo "=== built files in target dir ==="
          ls -lh bin/targets/armsr/armv8/ || true
          TAR=$(find bin/targets/armsr/armv8 -name '*rootfs.tar.gz' | head -n1)
          test -n "$TAR" || { echo "rootfs.tar.gz not found"; exit 1; }
          echo "=== using rootfs: $TAR ==="
          mkdir -p docker-build
          cp "$TAR" docker-build/rootfs.tar.gz
          cat > docker-build/Dockerfile <<'EOF'
          FROM scratch
          LABEL org.opencontainers.image.title="FanchmWrt arm64 rootfs"
          ADD rootfs.tar.gz /
          ENV PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          CMD ["/bin/sh"]
          EOF
          echo "=== docker context ==="
          ls -lh docker-build/
          echo "path=$TAR" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: ./docker-build
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-arm64-rootfs
          path: docker-build/rootfs.tar.gz
          retention-days: 14
